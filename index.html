<script>
  function processAndNest() {
    const sheetL = parseFloat(document.getElementById('sheetL').value);
    const sheetW = parseFloat(document.getElementById('sheetW').value);
    const rawText = document.getElementById('cutListInput').value.trim();

    if (!rawText) return alert("Please enter a cut list!");

    const lines = rawText.split('\n');
    let items = [];
    let charCode = 65;

    lines.forEach((line) => {
      const parts = line.toLowerCase().split('x').map(p => parseFloat(p.trim()));
      if (parts.length === 3 && !parts.some(isNaN)) {
        const [qty, l, w] = parts;
        const id = String.fromCharCode(charCode++);
        for (let i = 0; i < qty; i++) {
          items.push({ id: `${id}${i+1}`, tag: id, l, w });
        }
      }
    });

    // Sort by largest dimension first for tight packing
    items.sort((a, b) => Math.max(b.l, b.w) - Math.max(a.l, a.w));

    const kerf = 3;
    let sheets = [];

    items.forEach(item => {
      let placed = false;
      for (let s of sheets) {
        if (packMaxRects(s, item, kerf, sheetL, sheetW)) {
          placed = true;
          break;
        }
      }
      if (!placed) {
        let newSheet = { id: sheets.length + 1, items: [], freeRects: [{x:0, y:0, w:sheetL, h:sheetW}] };
        packMaxRects(newSheet, item, kerf, sheetL, sheetW);
        sheets.push(newSheet);
      }
    });

    renderUI(sheets, sheetL, sheetW);
  }

  function packMaxRects(sheet, item, kerf, maxL, maxW) {
    let bestRectIndex = -1;
    let bestRotated = false;
    let bestShortSideFit = Infinity;

    for (let i = 0; i < sheet.freeRects.length; i++) {
      let rect = sheet.freeRects[i];

      // Normal orientation
      if (rect.w >= item.l && rect.h >= item.w) {
        let leftoverX = Math.abs(rect.w - item.l);
        let leftoverY = Math.abs(rect.h - item.w);
        let shortSideFit = Math.min(leftoverX, leftoverY);
        if (shortSideFit < bestShortSideFit) {
          bestShortSideFit = shortSideFit;
          bestRectIndex = i;
          bestRotated = false;
        }
      }

      // Rotated orientation
      if (rect.w >= item.w && rect.h >= item.l) {
        let leftoverX = Math.abs(rect.w - item.w);
        let leftoverY = Math.abs(rect.h - item.l);
        let shortSideFit = Math.min(leftoverX, leftoverY);
        if (shortSideFit < bestShortSideFit) {
          bestShortSideFit = shortSideFit;
          bestRectIndex = i;
          bestRotated = true;
        }
      }
    }

    if (bestRectIndex === -1) return false;

    let chosenRect = sheet.freeRects[bestRectIndex];
    let w = bestRotated ? item.w : item.l;
    let h = bestRotated ? item.l : item.w;

    sheet.items.push({ ...item, x: chosenRect.x, y: chosenRect.y, renderedL: w, renderedW: h });

    // Split remaining space (Guillotine cut subdivision)
    let newFree = [];
    sheet.freeRects.forEach((r, idx) => {
      if (idx === bestRectIndex) {
        if (r.w - w - kerf > 0) newFree.push({ x: r.x + w + kerf, y: r.y, w: r.w - w - kerf, h: r.h });
        if (r.h - h - kerf > 0) newFree.push({ x: r.x, y: r.y + h + kerf, w: w, h: r.h - h - kerf });
      } else {
        newFree.push(r);
      }
    });

    sheet.freeRects = newFree;
    return true;
  }

  function renderUI(sheets, maxL, maxW) {
    document.getElementById('summary').innerHTML = `
      <span>Sheets Required: ${sheets.length}</span>
      <span>Stock Size: ${maxL}x${maxW}mm</span>
    `;

    const container = document.getElementById('sheetsContainer');
    container.innerHTML = '';

    sheets.forEach((s, idx) => {
      let svgHTML = `<div class="sheet-wrapper">
        <div class="sheet-title" style="font-weight:bold; margin-top:10px;">SHEET ${idx + 1} OF ${sheets.length}</div>
        <svg viewBox="0 0 ${maxL} ${maxW}">
          <rect x="0" y="0" width="${maxL}" height="${maxW}" fill="#334155" />`;

      s.items.forEach((item) => {
        svgHTML += `
          <g>
            <rect x="${item.x}" y="${item.y}" width="${item.renderedL}" height="${item.renderedW}" 
                  fill="#0284c7" stroke="#38bdf8" stroke-width="4" />
            <text x="${item.x + item.renderedL/2}" y="${item.y + item.renderedW/2}" 
                  fill="white" font-size="42" font-weight="bold" text-anchor="middle" dominant-baseline="middle">
              ${item.id} (${item.renderedL}x${item.renderedW})
            </text>
          </g>
        `;
      });

      svgHTML += `</svg></div>`;
      container.innerHTML += svgHTML;
    });
  }
</script>
