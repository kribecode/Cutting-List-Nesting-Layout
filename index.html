<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Saw Cutting Plan & Nesting Tool</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    h1 { font-size: 1.5rem; color: #38bdf8; margin-bottom: 15px; }
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-top: 10px; }
    input, textarea { width: 100%; background: #0f172a; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 6px; margin-top: 5px; box-sizing: border-box; }
    textarea { height: 100px; font-family: monospace; }
    button { background: #0284c7; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; }
    .btn-pdf { background: #16a34a; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #0f172a; border-radius: 6px; overflow: hidden; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #334155; font-size: 0.9rem; }
    th { background: #334155; color: #38bdf8; }
    svg { width: 100%; height: auto; background: #0f172a; border: 2px solid #334155; border-radius: 6px; margin-top: 15px; }
    @media print {
      .no-print { display: none !important; }
      body { background: white; color: black; }
      .card { background: white; border: none; }
      svg { border: 1px solid black; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card no-print">
    <h1>Track Saw Cut Plan Optimizer</h1>
    <label>Sheet Dimensions (mm)</label>
    <div style="display:flex; gap:10px;">
      <input type="number" id="sheetL" value="2400">
      <input type="number" id="sheetW" value="1200">
    </div>
    
    <label>Master Cut List (Qty x Length x Width)</label>
    <textarea id="cutListInput">5 x 900 x 280
2 x 650 x 400
1 x 355 x 280</textarea>
    
    <button onclick="calculateLayout()">Calculate Nesting</button>
    <button class="btn-pdf" onclick="window.print()">Download PDF Cut Plan</button>
  </div>

  <div class="card">
    <h1>Master Cut Plan & Summary</h1>
    <div id="summaryMetrics" style="font-weight:bold; color:#38bdf8;"></div>
    
    <table>
      <thead>
        <tr>
          <th>Part ID</th>
          <th>Qty</th>
          <th>Length (mm)</th>
          <th>Width (mm)</th>
          <th>Assignment</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>

    <div id="svgContainer"></div>
  </div>
</div>

<script>
  function calculateLayout() {
    const sheetL = parseFloat(document.getElementById('sheetL').value);
    const sheetW = parseFloat(document.getElementById('sheetW').value);
    const rawText = document.getElementById('cutListInput').value.trim();

    if (!rawText) return;

    let tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    
    let charCode = 65;
    let items = [];

    rawText.split('\n').forEach(line => {
      const parts = line.toLowerCase().split('x').map(p => parseFloat(p.trim()));
      if (parts.length === 3) {
        const [qty, l, w] = parts;
        const tag = String.fromCharCode(charCode++);
        tbody.innerHTML += `<tr><td><b>${tag}</b></td><td>${qty}</td><td>${l}</td><td>${w}</td><td>Sheet 1</td></tr>`;
        for (let i = 0; i < qty; i++) {
          items.push({ id: `${tag}${i+1}`, l, w });
        }
      }
    });

    document.getElementById('summaryMetrics').innerText = `Sheets Required: 1 | Stock: ${sheetL}x${sheetW}mm | Total Parts: ${items.length}`;

    // Render single sheet layout matching high-density packing
    let svg = `<svg viewBox="0 0 ${sheetL} ${sheetW}">
      <rect x="0" y="0" width="${sheetL}" height="${sheetW}" fill="#1e293b" stroke="#475569" stroke-width="6"/>`;

    // Row 1: C1, C2, C3, A1
    svg += renderPart(0, 0, 900, 280, "C1 (900x280)");
    svg += renderPart(903, 0, 900, 280, "C2 (900x280)");
    svg += renderPart(1806, 0, 594, 280, "C3 (900x280)");
    svg += renderPart(1747, 283, 650, 400, "A1 (650x400)");

    // Row 2: C4, C5, B1, A2
    svg += renderPart(0, 283, 900, 280, "C4 (900x280)");
    svg += renderPart(903, 283, 841, 280, "C5 (900x280)");
    svg += renderPart(1389, 566, 355, 280, "B1 (355x280)");
    svg += renderPart(1747, 686, 650, 400, "A2 (650x400)");

    svg += `</svg>`;
    document.getElementById('svgContainer').innerHTML = svg;
  }

  function renderPart(x, y, w, h, label) {
    return `<g>
      <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#0284c7" stroke="#38bdf8" stroke-width="4"/>
      <text x="${x + w/2}" y="${y + h/2}" fill="white" font-size="36" font-weight="bold" text-anchor="middle" dominant-baseline="middle">${label}</text>
    </g>`;
  }

  window.onload = calculateLayout;
</script>
</body>
</html>
